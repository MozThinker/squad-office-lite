name: Bug
description: Algo no Lite não funciona como o README diz.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Não coles tokens, chaves de API, palavras-passe nem o conteúdo do `.env`, `claude.env`, `runner.env` ou
        > `office.yaml` reais.** Esta issue é pública: qualquer pessoa a lê. Se precisares de mostrar um ficheiro,
        > troca os segredos por `…`. Falhas de segurança não vêm para aqui: ver o
        > [`SECURITY.md`](https://github.com/MozThinker/squad-office-lite/blob/main/SECURITY.md).
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      options:
        - VPS (Ubuntu)
        - Docker no PC (Windows)
        - Docker no PC (macOS)
        - Docker no PC (Linux)
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Lite
      description: "A da linha «versão instalada …» do `doctor` (no modo Docker, também a do endereço de onde descarregaste o `compose.yaml`)."
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema e versão do Docker
      description: "O sistema, a edição e a versão (por exemplo Windows 11 Home 23H2, macOS 15, Ubuntu 24.04) e a saída de `docker compose version`."
      placeholder: "Windows 11 23H2, Docker Compose version v2.40.0"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Saída do doctor
      description: |
        No modo Docker, na pasta do `compose.yaml`: `docker compose exec runner doctor`.
        Na VPS: `python3 ~/squad-office-lite/runner/office_runner.py doctor`.
        Revê-a antes de colar: não deve ter segredos, mas confirma.
      render: text
    validations:
      required: true
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
      description: Os passos que fizeste, por ordem, e o que viste (mensagens de erro, capturas de ecrã sem segredos).
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que esperavas
    validations:
      required: true
  - type: textarea
    id: registos
    attributes:
      label: Registos (opcional)
      description: "No modo Docker: `docker compose logs runner` (as últimas linhas). Sem segredos."
      render: text
