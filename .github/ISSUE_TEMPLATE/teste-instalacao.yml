name: Relatório de teste da instalação / Installation test report
description: Testaste o Lite com o README? Conta-nos como correu (mesmo que tenha corrido bem). / Tested the Lite with the README? Tell us how it went (even if it went well).
title: "[Teste] "
labels: [teste-instalacao]
# Os rótulos (label) e os id são um contrato: um script conta os relatórios pelas secções «### <rótulo>» do corpo da
# issue (exemplo em tests/fixtures/issue-teste-instalacao.md). Não os mudes sem actualizar a fixture e o script.
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Este relatório é público.** Nunca coles tokens, chaves de API, palavras-passe nem e-mails, nem o conteúdo do
        > `.env`. Na saída do `doctor`, tapa-os com `…` antes de colar. Se encontraste uma falha de segurança, não a
        > descrevas aqui: segue o [`SECURITY.md`](https://github.com/MozThinker/squad-office-lite/blob/main/SECURITY.md).
        >
        > **Don't paste tokens, API keys, passwords or email addresses, nor the contents of `.env`.** This report is
        > public. In the `doctor` output, replace them with `…` before pasting. If you found a security vulnerability,
        > don't describe it here: follow [`SECURITY.en.md`](https://github.com/MozThinker/squad-office-lite/blob/main/SECURITY.en.md).

        Obrigado por testares. Segue só o README público e conta-nos onde te perdeste: é isso que queremos corrigir.

        Thanks for testing. Follow only the public README (or [`README.en.md`](https://github.com/MozThinker/squad-office-lite/blob/main/README.en.md))
        and tell us where you got lost: that's what we want to fix. The Office interface is in Portuguese for now.
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / System
      description: O sistema onde correste o Lite (numa VPS, escolhe Linux). / The system you ran the Lite on (on a VPS, choose Linux).
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: versao_sistema
    attributes:
      label: Versão do sistema / System version
      description: "A versão e, no Windows, a edição (Home, Pro, Education…). / The version and, on Windows, the edition (Home, Pro, Education…)."
      placeholder: "Windows 11 Home 24H2 / macOS 15.6 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: versao_lite
    attributes:
      label: Versão do Lite / Lite version
      description: A versão que instalaste. / The version you installed.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: dropdown
    id: memoria
    attributes:
      label: Memória (RAM) / Memory (RAM)
      options:
        - 8 GB
        - 16 GB
        - Mais de 16 GB / More than 16 GB
    validations:
      required: true
  - type: dropdown
    id: docker_antes
    attributes:
      label: Já tinhas o Docker instalado? / Did you already have Docker installed?
      options:
        - Sim / Yes
        - Não / No
    validations:
      required: true
  - type: checkboxes
    id: verificacoes
    attributes:
      label: Verificações com ✓ nos «Primeiros passos» / Checks with ✓ in «Primeiros passos» (First steps)
      description: Marca as que chegaram a ✓ no ecrã do Office. / Tick the ones that reached ✓ on the Office screen.
      options:
        - label: Runner a dar sinal / Runner reporting in
        - label: claude instalado / claude installed
        - label: Credencial do Claude / Claude credential
        - label: Sessão do gh / gh session
  - type: dropdown
    id: ajuda
    attributes:
      label: Precisaste de ajuda? / Did you need help?
      options:
        - Não / No
        - Sim, nas Discussions / Yes, in Discussions
        - Sim, por outro meio / Yes, some other way
    validations:
      required: true
  - type: dropdown
    id: primeira_tarefa
    attributes:
      label: A 1.ª tarefa chegou ao fim? / Did the first task reach the end?
      description: Se o cartão da tua 1.ª tarefa passou para a coluna «Feito» ou «À espera de …». / Whether your first task's card moved to the «Feito» ("Done") or «À espera de …» ("Waiting for …") column.
      options:
        - Sim, chegou a «Feito» ou «À espera de …» / Yes, it reached «Feito» or «À espera de …»
        - Não / No
        - Não cheguei a lançar / I didn't get to launch it
    validations:
      required: true
  - type: input
    id: minutos
    attributes:
      label: Minutos até aos 4 ✓ / Minutes until all 4 ✓
      description: Desde o passo 1 do README até veres os quatro ✓ nos «Primeiros passos»; vazio se não chegaste lá. / From step 1 of the README until you saw all four ✓ in «Primeiros passos»; empty if you didn't get there.
      placeholder: "25"
  - type: textarea
    id: correu_mal
    attributes:
      label: O que correu mal / What went wrong
      description: Erros, passos que falharam ou que tiveste de repetir. / Errors, steps that failed or that you had to repeat.
  - type: textarea
    id: readme_confuso
    attributes:
      label: O que não percebeste no README / What you didn't understand in the README
      description: A secção (por exemplo «No teu PC…», passo 4) e o que te fez parar, voltar atrás ou procurar fora. / The section (for example “On your PC…”, step 4) and what made you stop, go back or search elsewhere.
  - type: textarea
    id: doctor
    attributes:
      label: Saída do doctor / doctor output
      description: "Se algo ficou ✗, a saída de `docker compose exec runner doctor` (Docker) ou `python3 ~/squad-office-lite/runner/office_runner.py doctor` (VPS), com os segredos e e-mails tapados. / If something stayed ✗, the output of `docker compose exec runner doctor` (Docker) or `python3 ~/squad-office-lite/runner/office_runner.py doctor` (VPS), with secrets and email addresses covered."
      render: text
