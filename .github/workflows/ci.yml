name: CI

# Squad Office Lite: só checks. Sem deploy, sem push de imagens, sem segredos: o instalador só corre no runner
# descartável do job «fumo» (imagem construída localmente, nunca publicada).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: py310
        with:
          python-version: "3.10"
      - name: Python 3.10 (officecfg e runner no host)
        run: |
          "$PY" -m pip install -q pytest
          "$PY" -m pytest -q tests/test_officecfg.py tests/test_runner_*.py
        env:
          PY: ${{ steps.py310.outputs.python-path }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: py314
        with:
          python-version: "3.14"
      - name: Python 3.14 (officecfg e runner no host)
        run: |
          "$PY" -m pip install -q pytest
          "$PY" -m pytest -q tests/test_officecfg.py tests/test_runner_*.py
        env:
          PY: ${{ steps.py314.outputs.python-path }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Python compila
        run: python -m py_compile server.py aprovacoes.py reader.py biblioteca.py quadro.py push.py progresso.py lancar.py officecfg.py runner/*.py tools/gerar_icones.py
      - name: API responde com dados vazios
        run: |
          mkdir -p /tmp/t /tmp/c
          OFFICE_CONFIG=office.example.yaml TASKS_DIR=/tmp/t CLAUDE_PROJECTS_DIR=/tmp/c PORT=8099 python server.py &
          for _ in $(seq 20); do curl -fsS -o /dev/null localhost:8099/healthz && break; sleep 0.5; done
          curl -fsS localhost:8099/healthz
          curl -fsS localhost:8099/api/state | python -c 'import json,sys; s = json.load(sys.stdin); assert s["tasks"] == [] and "probes" not in s and "crons" not in s and s["waiting"] == [] and s["aprovacoes"] == []'
          pagina=$(curl -fsS localhost:8099/)   # sem «| grep -q»: com pipefail, o grep fecha o pipe e o curl sai com 23
          grep -q "Squad Office" <<<"$pagina"
          # /api/config: a do exemplo, sem caminhos (nada começa por / ou ~)
          curl -fsS localhost:8099/api/config | python -c '
          import json, sys
          c = json.load(sys.stdin)
          def textos(v):
              if isinstance(v, dict): v = list(v.values())
              if isinstance(v, list): return [t for x in v for t in textos(x)]
              return [v] if isinstance(v, str) else []
          assert not [t for t in textos(c) if t.startswith(("/", "~"))], c
          assert c["marca"] == "Squad Office" and [p["id"] for p in c["projectos"]] == ["exemplo"] and c["aviso"] is None, c'
          curl -fsS localhost:8099/api/biblioteca | python -c 'import json,sys; assert json.load(sys.stdin)["itens"] == []'
          curl -fsS -o /dev/null localhost:8099/biblioteca.js
          curl -fsS -D /tmp/q.h localhost:8099/api/quadro | python -c 'import json,sys; q = json.load(sys.stdin); assert q["cartoes"] == [] and q["versao"] == "0" and q["escrita"] is False and len(q["colunas"]) == 5'
          # lançar (ADR-005): sem a pasta da fila fica desligado, mas os projectos lançáveis vêm sempre da config
          curl -fsS localhost:8099/api/quadro | python -c 'import json,sys; q = json.load(sys.stdin); assert q["lancar"] is False and q["dev_projectos"] == ["exemplo"]'
          grep -qi "^cache-control: no-store" /tmp/q.h
          curl -fsS -o /dev/null localhost:8099/quadro.js
          curl -fsS -o /dev/null localhost:8099/quadro.css
          # sem cryptography (CI sem deps): push desligado com 503, o resto igual
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8099/api/push/chave)" = 503
          curl -s localhost:8099/api/push/chave | python -c 'import json,sys; assert json.load(sys.stdin)["motivo"] == "sem_cryptography"'
          for f in definicoes.js definicoes.css icon-192.png apple-touch-icon.png; do curl -fsS -o /dev/null "localhost:8099/$f"; done
          curl -fsS localhost:8099/manifest.json | python -c 'import json,sys; m = json.load(sys.stdin); assert m["display"] == "standalone" and m["id"] and m["scope"] and {"192x192", "512x512"} <= {i["sizes"] for i in m["icons"]}'
      - name: Testes Python
        run: |
          python -m pip install -q pytest
          python -m pytest -q
      - name: Testes do push com cryptography
        run: |
          python -m pip install -q cryptography
          python -m pytest -q tests/test_push*.py
      - name: Testes do frontend (node)
        run: node --test tests/*.mjs
      - name: Scripts shell
        run: shellcheck install.sh get.sh scripts/*.sh
      - name: Compose de exemplo válido
        run: OFFICE_UID=1000 OFFICE_GID=1000 OFFICE_SITE=:80 OFFICE_AUTH_USER=x OFFICE_AUTH_HASH=x OFFICE_PROXY_SEGREDO=x docker compose -f docker-compose.example.yml config -q
      - name: Genérico (AC-a6, AC-b1, AC-b4, AC-e4)
        run: |
          falha=0
          nada() {  # nada <args do git grep>: falha se houver resultados (rc 0) ou erro (rc > 1)
            local rc=0
            git grep "$@" || rc=$?
            if [ "$rc" != 1 ]; then echo "::error::git grep $* deu resultados (ou erro)"; falha=1; fi
          }
          nada -nE 'PROBES_DI[R]|CRON_DI[R]|SUPPORT_STAT[E]|PORTFOLIO_FIL[E]|jobs\.jso[n]|incidentes\.jso[n]' -- . ':!.github/workflows/ci.yml'
          nada -nE 'WORKTREES_PREFIX|-home-' -- '*.py' '*.js'
          nada -niE '/hom[e]/' -- tests/
          exit "$falha"

  fumo:
    name: Fumo (install.sh em ${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # as versões que o README promete (22.04 traz Python 3.10, o mínimo do runner)
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sem claude no PATH o instalador recusa e não cria nada
        run: |
          if command -v claude; then echo "::error::o runner já tem um claude no PATH"; exit 1; fi
          if ./install.sh --sem-perguntas 2> "$RUNNER_TEMP/err"; then echo "::error::install.sh aceitou sem claude"; exit 1; fi
          cat "$RUNNER_TEMP/err"
          grep -q "^falta: claude" "$RUNNER_TEMP/err"
          test ! -e ~/office-lite
      - name: claude falso no PATH
        run: echo "$GITHUB_WORKSPACE/tests/bin" >> "$GITHUB_PATH"
      - name: Instalar duas vezes (idempotente)
        run: |
          openssl rand -hex 16 > "$RUNNER_TEMP/pw"
          echo "::add-mask::$(cat "$RUNNER_TEMP/pw")"
          # chave de API falsa (D10): o instalador grava ~/office-lite/claude.env 0600 e não o monta no contentor
          printf 'sk-ant-fumo-%s\n' "$(openssl rand -hex 16)" > "$RUNNER_TEMP/cred"
          echo "::add-mask::$(cat "$RUNNER_TEMP/cred")"
          export OFFICE_UTILIZADOR=ci OFFICE_PASSWORD_FILE="$RUNNER_TEMP/pw" OFFICE_CLAUDE_CRED=api OFFICE_CLAUDE_CRED_FILE="$RUNNER_TEMP/cred"
          ./install.sh --sem-perguntas
          sha256sum ~/office-lite/office.yaml ~/office-lite/.env ~/office-lite/claude.env > "$RUNNER_TEMP/sha"
          ./install.sh --sem-perguntas
          sha256sum -c "$RUNNER_TEMP/sha"
          test "$(stat -c %a ~/office-lite/claude.env)" = 600
          if grep -rqF "$(cat "$RUNNER_TEMP/cred")" ~/office-lite/.env ~/office-lite/office.yaml ~/office-lite/docker-compose.yml; then
            echo "::error::a credencial do Claude saiu do claude.env"; exit 1
          fi
          # permissões abertas: o instalador recusa (exit ≠ 0) e não as corrige em silêncio
          chmod 644 ~/office-lite/claude.env
          if ./install.sh --sem-perguntas; then echo "::error::install.sh aceitou claude.env 0644"; exit 1; fi
          chmod 600 ~/office-lite/claude.env
      - name: Caddy em http://localhost com basic auth
        run: |
          U="ci:$(cat "$RUNNER_TEMP/pw")"
          for _ in $(seq 60); do curl -fsS -o /dev/null -u "$U" http://localhost/healthz && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u "ci:errada-$RANDOM" http://localhost/api/state)" = 401
          curl -fsS -u "$U" http://localhost/healthz
          pagina=$(curl -fsS -u "$U" http://localhost/)   # sem «| grep -q»: com pipefail, o grep fecha o pipe e o curl sai com 23
          grep -q "Squad Office" <<<"$pagina"
          curl -fsS -u "$U" http://localhost/api/config | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          def textos(v):
              if isinstance(v, dict): v = list(v.values())
              if isinstance(v, list): return [t for x in v for t in textos(x)]
              return [v] if isinstance(v, str) else []
          assert not [t for t in textos(c) if t.startswith(("/", "~"))], c
          assert c["aviso"] is None and c["utilizador"]["nome"] == "ci", c'
      - name: Cabeçalhos de segurança em http://localhost (também no 401; sem HSTS)
        run: |
          curl -sI http://localhost/ | tr -d '\r' > "$RUNNER_TEMP/cab401"
          curl -s -o /dev/null -D - -u "ci:$(cat "$RUNNER_TEMP/pw")" http://localhost/ | tr -d '\r' > "$RUNNER_TEMP/cab200"
          for f in "$RUNNER_TEMP/cab401" "$RUNNER_TEMP/cab200"; do
            cat "$f"
            grep -qi "^content-security-policy: frame-ancestors 'none'$" "$f"
            grep -qi '^x-frame-options: DENY$' "$f"
            grep -qi '^referrer-policy: same-origin$' "$f"
            if grep -qi '^strict-transport-security:' "$f"; then echo "::error::HSTS sem domínio"; exit 1; fi
          done
          head -n 1 "$RUNNER_TEMP/cab401" | grep -q ' 401'
          head -n 1 "$RUNNER_TEMP/cab200" | grep -q ' 200'
      - name: Office sem o segredo do proxy dá 403 (só o /healthz passa)
        run: |
          grep -qE "^OFFICE_PROXY_SEGREDO='[0-9a-f]{64}'$" ~/office-lite/.env
          docker compose -f ~/office-lite/docker-compose.yml exec -T office python -c '
          import urllib.error, urllib.request
          def estado(path, h={}):
              try:
                  return urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8080" + path, headers=h), timeout=5).status
              except urllib.error.HTTPError as e:
                  return e.code
          assert estado("/healthz") == 200
          for p in ("/api/state", "/api/config", "/"):
              assert estado(p) == 403, p
              assert estado(p, {"X-Office-Segredo": "errado"}) == 403, p'
      - name: Quadro cria um cartão e lança-o (POST via Caddy)
        run: |
          python3 - <<'EOF'
          import base64, json, os, urllib.request
          tmp = os.environ["RUNNER_TEMP"]
          pw = open(f"{tmp}/pw").read().strip()
          B = "http://localhost"
          auth = "Basic " + base64.b64encode(f"ci:{pw}".encode()).decode()

          def pedir(path, corpo=None):
              h, data = {"Authorization": auth}, None
              if corpo is not None:
                  h.update({"Content-Type": "application/json", "Origin": B})
                  data = json.dumps(corpo).encode()
              with urllib.request.urlopen(urllib.request.Request(B + path, data=data, headers=h), timeout=15) as r:
                  return r.status, json.load(r)

          token = pedir("/api/state")[1]["token"]
          _, q = pedir("/api/quadro")
          assert q["escrita"] is True and q["lancar"] is True and q["dev_projectos"] == ["exemplo"], q
          c, q = pedir("/api/quadro", {"op": "criar", "token": token, "versao": q["versao"], "titulo": "Fumo CI",
                                       "descricao": "", "projecto": "exemplo", "coluna": "a-fazer", "etiquetas": []})
          assert c == 200, (c, q)
          cartao = next(x["id"] for x in q["cartoes"] if x["titulo"] == "Fumo CI")
          c, r = pedir("/api/quadro/lancar", {"token": token, "versao": q["versao"], "cartao_id": cartao, "posicao": 0,
                                              "squad": "dev", "projecto": "exemplo", "kind": "feat", "mode": "task",
                                              "slug": "fumo-ci", "titulo": "Fumo CI", "brief": "Teste de fumo da CI."})
          assert c == 202, (c, r)
          open(f"{tmp}/pedido", "w").write(r["id"])
          print("pedido", r["id"])
          EOF
      - name: Runner lança a tarefa e a API mostra-a
        run: |
          fila=~/office-lite/dados/quadro-lancar
          pedido=$(cat "$RUNNER_TEMP/pedido")
          # o timer systemd pode ter apanhado o pedido primeiro (lock partilhado): basta o .feito.json aparecer
          # o claude falso falha se não receber ANTHROPIC_API_KEY/CLAUDE_CODE_OAUTH_TOKEN no ambiente
          export FAKE_CLAUDE_EXIGE_CRED=1
          for _ in $(seq 30); do
            python3 runner/office_runner.py --uma-vez --config ~/office-lite/office.yaml
            [ -f "$fila/$pedido.feito.json" ] && break
            sleep 2
          done
          tid=$(python3 -c 'import json,sys; d = json.load(open(sys.argv[1])); assert d.get("task_id"), d; print(d["task_id"])' "$fila/$pedido.feito.json")
          echo "tarefa $tid"
          U="ci:$(cat "$RUNNER_TEMP/pw")"
          ok=0
          for _ in $(seq 30); do
            curl -fsS -u "$U" http://localhost/api/state | python3 -c 'import json,sys; sys.exit(0 if any(t["id"] == sys.argv[1] for t in json.load(sys.stdin)["tasks"]) else 1)' "$tid" && ok=1 && break
            sleep 2
          done
          test "$ok" = 1
          # o contentor nunca vê as credenciais do Claude
          if docker compose -f ~/office-lite/docker-compose.yml exec -T office sh -c 'grep -rlF sk-ant- /config /data 2>/dev/null'; then
            echo "::error::o contentor vê a credencial do Claude"; exit 1
          fi
      - name: Ficheiros escritos pelo contentor são do utilizador
        run: |
          eu=$(id -u)
          for f in ~/office-lite/dados/quadro/cartoes.json ~/office-lite/dados/quadro-lancar/"$(cat "$RUNNER_TEMP/pedido")".json; do
            echo "$(stat -c %u "$f") $f"
            test "$(stat -c %u "$f")" = "$eu"
          done
      - name: Units systemd do runner válidas
        run: |
          u="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
          ls -l "$u"
          [ -d "${XDG_RUNTIME_DIR:-/nonexistent}" ] || XDG_RUNTIME_DIR=$(mktemp -d) && export XDG_RUNTIME_DIR
          systemd-analyze --user verify "$u/office-runner.service" "$u/office-runner.timer"
      - name: Modo Traefik (compose gerado válido)
        run: |
          docker network create t
          python3 runner/gerar_compose.py --config ~/office-lite/office.yaml --proxy traefik --rede t --dominio x.example.org \
            > "$RUNNER_TEMP/traefik.yml"
          docker compose -f "$RUNNER_TEMP/traefik.yml" --env-file ~/office-lite/.env config -q
      - name: Logs em falha
        if: failure()
        run: |
          docker compose -f ~/office-lite/docker-compose.yml logs --no-color --tail 200 || true
          ls -la ~/office-lite/dados/quadro-lancar ~/office-lite/dados/tasks || true
          tail -n 50 ~/office-lite/dados/runner/logs/*.log || true
      - name: Parar e limpar
        if: always()
        run: |
          if [ -f ~/office-lite/docker-compose.yml ]; then docker compose -f ~/office-lite/docker-compose.yml down -v; fi
          docker network rm t || true

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          range="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}"
          case "$range" in 0000000*|..*) range="${{ github.sha }}";; esac
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --redact --no-banner --verbose --log-opts="$range"

  fumo-docker:
    name: Fumo (modo Docker, imagens construídas aqui)
    # Imagens construídas localmente com as refs por omissão e usadas com --pull never: nada é publicado nem
    # descarregado do GHCR. O claude real só corre o --version; as tarefas usam o claude falso (tests/bin/claude).
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compose de exemplo válido sem .env (só omissões)
        run: |
          test ! -e .env
          docker compose version
          docker compose -f compose.example.yaml config -q
          docker compose -f compose.example.yaml config --format json > "$RUNNER_TEMP/exemplo.json"
          python3 - "$RUNNER_TEMP/exemplo.json" >> "$GITHUB_ENV" <<'EOF'
          import json, sys
          sys.path.insert(0, ".")
          import officecfg
          s = json.load(open(sys.argv[1]))["services"]
          o, r = s["office"]["image"], s["runner"]["image"]
          assert o.endswith(f"/squad-office-lite:{officecfg.VERSAO}"), o
          assert r.endswith(f"/squad-office-lite-runner:{officecfg.VERSAO}"), r
          print(f"IMG_OFFICE={o}\nIMG_RUNNER={r}")
          EOF
      - name: Construir as duas imagens com as refs por omissão
        run: |
          docker build -t "$IMG_OFFICE" .
          docker build -f Dockerfile.runner -t "$IMG_RUNNER" .
      - name: Pasta do leitor (compose.yaml, claude falso por override, projecto exemplo)
        run: |
          pc="$RUNNER_TEMP/pc"
          mkdir -p "$pc/projectos"
          cp compose.example.yaml "$pc/compose.yaml"
          cat > "$pc/fumo.yaml" <<EOF
          services:
            runner:
              volumes:
                - type: bind
                  source: $GITHUB_WORKSPACE/tests/bin/claude
                  target: /usr/local/bin/claude
                  read_only: true
          EOF
          git init -q -b main "$pc/projectos/exemplo"
          printf '# Exemplo\n' > "$pc/projectos/exemplo/README.md"
          git -C "$pc/projectos/exemplo" add README.md
          git -C "$pc/projectos/exemplo" -c user.name=CI -c user.email=ci@example.org commit -qm "primeiro commit"
          # o leitor em Linux sem Docker Desktop: os ficheiros dos projectos ficam dele
          { echo "OFFICE_UID=$(id -u)"; echo "OFFICE_GID=$(id -g)"; echo "COMPOSE_FILE=compose.yaml:fumo.yaml"; } >> "$GITHUB_ENV"
      - name: configurar --sem-perguntas (segredos só em ficheiros montados)
        run: |
          cd "$RUNNER_TEMP/pc"
          e="$RUNNER_TEMP/entrada"
          mkdir -m 700 "$e"
          openssl rand -hex 16 > "$e/pw"
          echo "::add-mask::$(cat "$e/pw")"
          printf 'sk-ant-fumo-%s\n' "$(openssl rand -hex 16)" > "$e/cred"
          echo "::add-mask::$(cat "$e/cred")"
          chmod 600 "$e/pw" "$e/cred"
          docker compose run --rm -T -v "$e:/entrada:ro" \
            -e OFFICE_AUTH_USER=ci -e OFFICE_AUTH_PASS_FILE=/entrada/pw -e OFFICE_PROJECTOS_IDS=exemplo \
            -e OFFICE_GIT_NOME=CI -e OFFICE_GIT_EMAIL=ci@example.org \
            -e OFFICE_CLAUDE_CRED=api -e OFFICE_CLAUDE_CRED_FILE=/entrada/cred \
            configurar --sem-perguntas | tee "$RUNNER_TEMP/configurar.out"
          grep -q "docker compose up -d" "$RUNNER_TEMP/configurar.out"
          if grep -qF -f "$e/pw" -f "$e/cred" "$RUNNER_TEMP/configurar.out"; then
            echo "::error::o configurar escreveu um segredo na saída"; exit 1
          fi
      - name: claude, gh e git reais na imagem do runner (versão fixada)
        run: |
          cd "$RUNNER_TEMP/pc"
          quer=$(sed -nE 's/^ARG CLAUDE_VERSAO="?([0-9][0-9.]*)"?$/\1/p' "$GITHUB_WORKSPACE/Dockerfile.runner")
          test -n "$quer"
          # só o compose.yaml: sem o override, é o binário da imagem
          docker compose -f compose.yaml run --rm -T --no-deps runner sh -c 'claude --version && gh --version && git --version' \
            | tee "$RUNNER_TEMP/versoes"
          grep -qF "$quer" "$RUNNER_TEMP/versoes"
      - name: up -d e Caddy em http://localhost:8080 com basic auth
        run: |
          cd "$RUNNER_TEMP/pc"
          # o Caddy vem do Docker Hub (por digest); office e runner só existem localmente
          docker compose pull caddy
          docker compose up -d --pull never
          U="ci:$(cat "$RUNNER_TEMP/entrada/pw")"
          for _ in $(seq 60); do curl -fsS -o /dev/null -u "$U" http://localhost:8080/healthz && break; sleep 2; done
          docker compose ps
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u "ci:errada-$RANDOM" http://localhost:8080/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u "$U" http://localhost:8080/)" = 200
          pagina=$(curl -fsS -u "$U" http://localhost:8080/)   # sem «| grep -q»: com pipefail, o grep fecha o pipe e o curl sai com 23
          grep -q "Squad Office" <<<"$pagina"
          curl -fsS -u "$U" http://localhost:8080/api/config | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          def textos(v):
              if isinstance(v, dict): v = list(v.values())
              if isinstance(v, list): return [t for x in v for t in textos(x)]
              return [v] if isinstance(v, str) else []
          assert not [t for t in textos(c) if t.startswith(("/", "~"))], c
          assert c["modo"] == "docker" and [p["id"] for p in c["projectos"]] == ["exemplo"], c'
      - name: Cabeçalhos em localhost:8080 (também no 401; sem HSTS)
        run: |
          curl -sI http://localhost:8080/ | tr -d '\r' > "$RUNNER_TEMP/cab401"
          curl -s -o /dev/null -D - -u "ci:$(cat "$RUNNER_TEMP/entrada/pw")" http://localhost:8080/ | tr -d '\r' > "$RUNNER_TEMP/cab200"
          for f in "$RUNNER_TEMP/cab401" "$RUNNER_TEMP/cab200"; do
            cat "$f"
            grep -qi "^content-security-policy: frame-ancestors 'none'$" "$f"
            grep -qi '^x-frame-options: DENY$' "$f"
            grep -qi '^referrer-policy: same-origin$' "$f"
            if grep -qi '^strict-transport-security:' "$f"; then echo "::error::HSTS sem HTTPS"; exit 1; fi
          done
          head -n 1 "$RUNNER_TEMP/cab401" | grep -q ' 401'
          head -n 1 "$RUNNER_TEMP/cab200" | grep -q ' 200'
      - name: Cartão lançado por POST via Caddy; o ciclo do runner leva a tarefa até ao fim
        run: |
          cd "$RUNNER_TEMP/pc"
          cat > "$RUNNER_TEMP/fumo.py" <<'EOF'
          """fumo.py lancar SLUG TITULO → task_id (espera o .feito.json) · fumo.py esperar TID a-correr|final → estado"""
          import base64, json, os, subprocess, sys, time, urllib.request
          pw = open(os.environ["RUNNER_TEMP"] + "/entrada/pw").read().strip()
          B = "http://localhost:8080"
          auth = "Basic " + base64.b64encode(f"ci:{pw}".encode()).decode()

          def pedir(path, corpo=None):
              h, data = {"Authorization": auth}, None
              if corpo is not None:
                  h.update({"Content-Type": "application/json", "Origin": B})
                  data = json.dumps(corpo).encode()
              with urllib.request.urlopen(urllib.request.Request(B + path, data=data, headers=h), timeout=15) as r:
                  return r.status, json.load(r)

          def lancar(slug, titulo):
              token = pedir("/api/state")[1]["token"]
              _, q = pedir("/api/quadro")
              assert q["escrita"] is True and q["lancar"] is True and q["dev_projectos"] == ["exemplo"], q
              c, q = pedir("/api/quadro", {"op": "criar", "token": token, "versao": q["versao"], "titulo": titulo,
                                           "descricao": "", "projecto": "exemplo", "coluna": "a-fazer", "etiquetas": []})
              assert c == 200, (c, q)
              cartao = next(x["id"] for x in q["cartoes"] if x["titulo"] == titulo)
              c, r = pedir("/api/quadro/lancar", {"token": token, "versao": q["versao"], "cartao_id": cartao, "posicao": 0,
                                                  "squad": "dev", "projecto": "exemplo", "kind": "feat", "mode": "task",
                                                  "slug": slug, "titulo": titulo, "brief": "Teste de fumo da CI."})
              assert c == 202, (c, r)
              feito = f"/dados/quadro-lancar/{r['id']}.feito.json"
              for _ in range(48):   # o ciclo passa de 60 em 60 s
                  p = subprocess.run(["docker", "compose", "exec", "-T", "runner", "cat", feito], capture_output=True,
                                     text=True, check=False)
                  if p.returncode == 0:
                      d = json.loads(p.stdout)
                      assert d.get("task_id"), d
                      return d["task_id"]
                  time.sleep(5)
              sys.exit(f"o runner não pegou no pedido {r['id']}")

          def esperar(tid, quer):
              t = None
              for _ in range(60):
                  t = next((x for x in pedir("/api/state")[1]["tasks"] if x["id"] == tid), None)
                  if t and (t["status"] == "a correr" if quer == "a-correr" else
                            not t["running"] and t["status"] not in ("a correr", "parada?", "morreu")):
                      return t["status"]
                  time.sleep(3)
              sys.exit(f"a tarefa {tid} não chegou a {quer}: {t}")

          print(lancar(*sys.argv[2:4]) if sys.argv[1] == "lancar" else esperar(*sys.argv[2:4]))
          EOF
          tid=$(python3 "$RUNNER_TEMP/fumo.py" lancar fumo-ci "Fumo CI")
          echo "tarefa $tid"
          estado=$(python3 "$RUNNER_TEMP/fumo.py" esperar "$tid" final)
          echo "estado final: $estado"
          test "$estado" != erro
          # o office nunca vê a credencial do Claude
          if docker compose exec -T office sh -c 'grep -rlF sk-ant- /config /data /proxy 2>/dev/null'; then
            echo "::error::o contentor office vê a credencial do Claude"; exit 1
          fi
      - name: restart e recreate não desfazem o dono dos volumes (nocopy; OFFICE_UID do runner do GitHub, não 10001)
        run: |
          cd "$RUNNER_TEMP/pc"
          test "$OFFICE_UID" != 10001
          docker compose restart
          docker compose up -d --force-recreate --pull never
          U="ci:$(cat "$RUNNER_TEMP/entrada/pw")"
          for _ in $(seq 60); do curl -fsS -o /dev/null -u "$U" http://localhost:8080/healthz && break; sleep 2; done
          docker compose exec -T runner stat -c '%u:%g %a %n' /dados/runner /dados/quadro /dados/push /home/office
          for p in /dados/runner /dados/quadro; do
            test "$(docker compose exec -T runner stat -c %u "$p")" = "$OFFICE_UID"
          done
          test "$(docker compose exec -T office stat -c %u /data/quadro)" = "$OFFICE_UID"
          tid=$(python3 "$RUNNER_TEMP/fumo.py" lancar fumo-recreate "Fumo recreate")
          echo "tarefa $tid"
          estado=$(python3 "$RUNNER_TEMP/fumo.py" esperar "$tid" final)
          echo "estado final: $estado"
          test "$estado" != erro
      - name: exec runner doctor (linhas do modo Docker; sem gh o código de saída é 1)
        run: |
          cd "$RUNNER_TEMP/pc"
          f="$RUNNER_TEMP/doctor"
          docker compose exec -T runner doctor > "$f" || true
          cat "$f"
          grep -q '^✓ office\.yaml válido' "$f"
          grep -qi '^✓ credencial' "$f"
          grep -q '^✓ .*exemplo' "$f"
          grep -q '^ℹ ' "$f"
          if grep -nE 'systemctl|loginctl|linger|install\.sh|docker info' "$f"; then
            echo "::error::o doctor do modo Docker fala do modo VPS"; exit 1
          fi
          if grep '^✗' "$f" | grep -vF 'docker compose run --rm configurar --gh'; then
            echo "::error::✗ inesperado (só a sessão do gh pode faltar)"; exit 1
          fi
          if grep -qF -f "$RUNNER_TEMP/entrada/cred" "$f"; then echo "::error::o doctor mostrou a credencial"; exit 1; fi
      - name: exec runner parar numa 2.ª tarefa (claude falso que não acaba)
        run: |
          cd "$RUNNER_TEMP/pc"
          printf '#!/bin/sh\nexec sleep 600\n' > "$RUNNER_TEMP/claude-lento"
          chmod 755 "$RUNNER_TEMP/claude-lento"
          cat > fumo-lento.yaml <<EOF
          services:
            runner:
              volumes:
                - type: bind
                  source: $RUNNER_TEMP/claude-lento
                  target: /usr/local/bin/claude
                  read_only: true
          EOF
          export COMPOSE_FILE=compose.yaml:fumo.yaml:fumo-lento.yaml
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose up -d --pull never runner
          tid=$(python3 "$RUNNER_TEMP/fumo.py" lancar fumo-parar "Fumo parar")
          echo "tarefa $tid"
          python3 "$RUNNER_TEMP/fumo.py" esperar "$tid" a-correr
          docker compose exec -T runner parar "$tid" | tee "$RUNNER_TEMP/parar.out"
          grep -q "parada" "$RUNNER_TEMP/parar.out"
          test "$(python3 "$RUNNER_TEMP/fumo.py" esperar "$tid" final)" = erro
          docker compose exec -T runner python3 -c '
          import json, sys
          m = json.load(open(sys.argv[1]))
          assert m["status"] == "erro" and m["result"] == "parada pelo utilizador", m' "/dados/tasks/$tid/meta.json"
          # o claude morreu e o ciclo recolheu o correr (sem zombies; recolhe a cada passagem de 60 s)
          ok=0
          for _ in $(seq 24); do
            docker compose exec -T runner python3 -c '
          import os, sys
          maus = []
          for p in filter(str.isdigit, os.listdir("/proc")):
              try:
                  st = open(f"/proc/{p}/stat").read()
                  cmd = open(f"/proc/{p}/cmdline", "rb").read()
              except OSError:
                  continue
              if st.rsplit(")", 1)[1].split()[0] == "Z" or cmd.startswith(b"sleep\0"):
                  maus.append((p, st[:60]))
          print(maus)
          sys.exit(1 if maus else 0)' && ok=1 && break
            sleep 5
          done
          test "$ok" = 1
      - name: docker inspect (sem socket, sem privilégios; runner sem proxy; office e caddy sem segredos)
        run: |
          cd "$RUNNER_TEMP/pc"
          # shellcheck disable=SC2046
          docker inspect $(docker compose ps -q office caddy runner) > "$RUNNER_TEMP/inspect.json"
          python3 - "$RUNNER_TEMP/inspect.json" <<'EOF'
          import json, sys
          vistos = set()
          for c in json.load(open(sys.argv[1])):
              svc = c["Config"]["Labels"]["com.docker.compose.service"]
              vistos.add(svc)
              hc, m = c["HostConfig"], c["Mounts"]
              assert not hc.get("Privileged") and hc.get("NetworkMode") != "host", (svc, hc)
              # no-new-privileges e cap_drop ALL em todos; cap_add só no Caddy (o configurar não fica a correr)
              caps = {"caddy": {"NET_BIND_SERVICE", "DAC_OVERRIDE"}}.get(svc, set())
              assert {x.removeprefix("CAP_") for x in hc.get("CapAdd") or []} == caps, (svc, hc.get("CapAdd"))
              assert [x.removeprefix("CAP_") for x in hc.get("CapDrop") or []] == ["ALL"], (svc, hc.get("CapDrop"))
              assert "no-new-privileges:true" in (hc.get("SecurityOpt") or []), (svc, hc.get("SecurityOpt"))
              assert not [x for x in m if "docker.sock" in x.get("Source", "") + x.get("Destination", "")], (svc, m)
              nomes = [x["Name"] for x in m if x["Type"] == "volume"]
              assert all(n.startswith("office-lite-pc_") for n in nomes), (svc, nomes)
              vol = {n.removeprefix("office-lite-pc_") for n in nomes}
              dest = {x["Destination"] for x in m}
              env = [e.split("=", 1)[0] for e in c["Config"]["Env"] or []]
              portas = {k: v for k, v in (hc.get("PortBindings") or {}).items() if v}
              assert (svc == "caddy") == bool(portas), (svc, portas)
              if svc == "runner":
                  assert "proxy" not in vol and "/proxy" not in dest, (svc, vol)
                  assert not [e for e in env if e.startswith(("OFFICE_PROXY_SEGREDO", "OFFICE_AUTH_"))], env
                  assert hc.get("Init") is True and hc.get("ReadonlyRootfs") is True, svc
              else:
                  assert not vol & {"segredos", "runner-home", "runner"}, (svc, vol)
                  assert not dest & {"/segredos", "/home/office", "/projectos"}, (svc, dest)
              if svc == "office":
                  assert hc.get("ReadonlyRootfs") is True, svc
          assert vistos == {"office", "caddy", "runner"}, vistos
          EOF
          # nem a palavra-passe nem a credencial no ambiente ou no argv de algum contentor
          if grep -qF -f "$RUNNER_TEMP/entrada/pw" -f "$RUNNER_TEMP/entrada/cred" "$RUNNER_TEMP/inspect.json"; then
            echo "::error::segredo no docker inspect"; exit 1
          fi
      - name: Logs em falha
        if: failure()
        run: |
          cd "$RUNNER_TEMP/pc" || exit 0
          docker compose ps -a || true
          docker compose logs --no-color --tail 200 || true
          docker compose exec -T runner sh -c 'stat -c "%u:%g %a %n" /dados/* /home/office; ls -la /dados/quadro-lancar /dados/tasks; tail -n 50 /dados/runner/logs/*.log' || true
      - name: Parar e limpar
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pc/compose.yaml" ]; then cd "$RUNNER_TEMP/pc" && docker compose down -v; fi
