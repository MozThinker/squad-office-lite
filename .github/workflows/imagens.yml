name: Imagens (construir, atestar e publicar no GHCR)

# Proposta (ADR-008): copiar para .github/workflows/imagens.yml só no repositório público. Corre à mão depois do
# release.yml, sobre a tag vX.Y.Z e a release vX.Y.Z EM RASCUNHO: constrói as imagens office e runner para
# linux/amd64 e linux/arm64, publica-as em ghcr.io/<dono>/<repo>[-runner]:X.Y.Z, atesta-as (proveniência SLSA,
# guardada também no registry), gera o compose.yaml com as imagens fixadas por digest, atesta-o com o env.example e
# anexa os dois ao rascunho. Não mexe no SHA256SUMS (o get.sh exige uma só linha), nunca publica a release e não usa
# segredos configurados: só o token do próprio workflow (packages: write é a excepção do ADR-008).

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão X.Y.Z (sem o v; a tag vX.Y.Z e a release em rascunho já existem)"
        required: true
        type: string

concurrency:
  group: imagens-${{ inputs.versao }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  imagens:
    name: Construir, publicar, atestar e anexar
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSAO: ${{ inputs.versao }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Versão válida
        run: |
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::versão inválida (usa X.Y.Z)"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ inputs.versao }}
          persist-credentials: false
      - name: A release existe e está em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rascunho=$(gh release view "v$VERSAO" --json isDraft --jq .isDraft)
          if [ "$rascunho" != true ]; then echo "::error::a release v$VERSAO não existe ou já não está em rascunho"; exit 1; fi
      - name: Nomes das imagens (minúsculas; iguais às refs por omissão do compose.example.yaml)
        run: |
          imagem="ghcr.io/${GH_REPO,,}"
          test "$(python3 -c 'import officecfg; print(officecfg.VERSAO)')" = "$VERSAO"
          grep -qxF "    image: $imagem:$VERSAO" compose.example.yaml
          grep -qxF "    image: $imagem-runner:$VERSAO" compose.example.yaml
          { echo "IMAGEM_OFFICE=$imagem"; echo "IMAGEM_RUNNER=$imagem-runner"; } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: office
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGEM_OFFICE }}:${{ inputs.versao }}
      - id: runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGEM_RUNNER }}:${{ inputs.versao }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEM_OFFICE }}
          subject-digest: ${{ steps.office.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEM_RUNNER }}
          subject-digest: ${{ steps.runner.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: compose.yaml com as imagens fixadas por digest
        env:
          DIGEST_OFFICE: ${{ steps.office.outputs.digest }}
          DIGEST_RUNNER: ${{ steps.runner.outputs.digest }}
        run: |
          for d in "$DIGEST_OFFICE" "$DIGEST_RUNNER"; do
            if ! [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::digest inválido: $d"; exit 1; fi
          done
          mkdir -p dist
          python3 runner/gerar_compose.py --modo docker \
            --imagem-office "$IMAGEM_OFFICE:$VERSAO@$DIGEST_OFFICE" \
            --imagem-runner "$IMAGEM_RUNNER:$VERSAO@$DIGEST_RUNNER" > dist/compose.yaml
          cp env.example dist/env.example
          docker compose -f dist/compose.yaml config -q
          grep -qxF "    image: $IMAGEM_OFFICE:$VERSAO@$DIGEST_OFFICE" dist/compose.yaml
          test "$(grep -cxF "    image: $IMAGEM_RUNNER:$VERSAO@$DIGEST_RUNNER" dist/compose.yaml)" = 2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/compose.yaml
            dist/env.example
      - name: Anexar à release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rascunho=$(gh release view "v$VERSAO" --json isDraft --jq .isDraft)
          if [ "$rascunho" != true ]; then echo "::error::a release v$VERSAO já não está em rascunho"; exit 1; fi
          gh release upload "v$VERSAO" dist/compose.yaml dist/env.example --clobber
