# Squad Office Lite — configuração. Subconjunto de YAML: ver README, «Referência · office.yaml».
versao: 1
marca: Squad Office
utilizador:
  nome: Utilizador
  contacto: ""
fuso: Europe/Lisbon
raizes:
  dados: ~/office-lite/dados
  projectos: ~/projectos
  claude_projects: ~/.claude/projects
squads:
  - id: dev
    nome: Dev
    lead: tech-lead
    personagem: Maestro
    tipos: [feat, fix]
    modos: [goal, task]
    # modelo da sessão principal desta squad (--model); sem esta chave, o runner.modelo (ou o do claude)
    # modelo: sonnet
projectos:
  - id: exemplo
    nome: Exemplo
    glifo: "◆"
    repo: exemplo
colunas:
  ideias: Ideias
  a-fazer: A fazer
  em-curso: Em curso
  # sem esta chave: «À espera de <utilizador.nome>» (um valor vazio não valida)
  # a-espera: À espera de revisão
  feito: Feito
biblioteca:
  - id: material
    rotulo: Material
    pasta: material
    media: true
    # arquivo automático por idade (7–3650 dias; sem esta chave nunca arquiva sem pedido): ver README, «Biblioteca»
    # arquivo_dias: 180
runner:
  tecto_diario: 10
  paralelo: 1
  rotacao_dias: 14
  # dontAsk: o claude recusa sem perguntar o que não estiver em `ferramentas`; não é um muro: ver README, «Runner».
  # auto, acceptEdits e bypassPermissions também são aceites (mais abertos).
  permission_mode: dontAsk
  settings: ""
  # teto de custo em USD por arranque do claude (--max-budget-usd; cada retoma pode gastar até ao teto)
  # max_usd: 5
  # modelo do claude (--model): alias ou nome completo; sem esta chave, o do claude
  # modelo: sonnet
  # ferramentas pré-autorizadas (--allowedTools). Sem esta chave vale a lista por omissão (README, «Runner»):
  # leitura/edição, tarefas (Task*), Agent, git, gh pr create/view/checks/edit/list/ready, gh run e testes/build
  # comuns (sem web).
  # Para a substituir, descomenta e ajusta (os proibidos do runner ganham sempre):
  # ferramentas:
  #   - Read
  #   - Edit
  #   - Write
  #   - Bash(git *)
  #   - Bash(npm test *)
# Conversa (o teu Claude Code no telemóvel; ver CONVERSA.md): desligada por omissão. Abre noutro endereço (o `site`),
# servida pelo guardião do host; o Office só mostra um botão para lá. Depois de correr `sudo ./instalar-conversa.sh`
# (que define as permissões e a voz; o nome do assistente muda-se na própria Conversa), liga-a aqui e volta a correr
# o install.sh.
# conversa:
#   ativa: false
#   # pasta criada pelo instalar-conversa.sh (obrigatória com ativa: true)
#   pasta: /srv/office-conversa
#   # endereço próprio da Conversa (o do botão no Office; de preferência noutro domínio registável que não o do Office)
#   site: conversa.exemplo.com
#   # externo (omissão): o TLS termina fora da fabrica, num túnel teu ligado ao socket do guardião (ver CONVERSA.md);
#   # caddy: o Caddy do Office serve o site (precisa do install.sh com --dominio, noutro nome), mas aí o TLS termina
#   # na fabrica e quem a controle pode servir JS na origem da Conversa
#   tls: externo
